<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Logistic Population Growth — Continuous &amp; Discrete — Simulation</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="card" id="simbox">
<div class="simbar"><span class="simbar-logo" aria-hidden="true"><img src="images\logo.svg" alt="Amrita Vishwa Vidyapeetham"></span><h1 class="simbar-title">Logistic Population Growth — Continuous &amp; Discrete</h1><button class="fs-btn" id="fsBtn" onclick="toggleFS()" title="Toggle full screen" aria-label="Toggle full screen">⛶</button></div>
<div class="sim">
<div class="controls">
<label style="font-weight:600;font-size:.9rem;display:block;margin-bottom:6px">Mode</label>
<select class="dropBox" id="mode" onchange="run()">
  <option value="cont">Continuous time — dN/dt = rN(1−(N/K)^θ)</option>
  <option value="dis">Discrete time — Nₜ₊₁ = Nₜ + rNₜ(1−(Nₜ/K)^θ)</option>
  <option value="bif">Bifurcation diagram (vary r)</option>
  <option value="den">Effect of population density</option>
</select>
<div class="field"><label>Initial population N₀ <span class="val" id="v_n0">10</span></label><input type="range" id="n0" min="1" max="200" value="10" oninput="sync()"></div>
<div class="field"><label>Growth rate r <span class="val" id="v_r">0.6</span></label><input type="range" id="r" min="0.05" max="3" step="0.05" value="0.6" oninput="sync()"><div class="hint">Discrete model gets cycles/chaos as r rises above ~2.</div></div>
<div class="field"><label>Carrying capacity K <span class="val" id="v_K">100</span></label><input type="range" id="K" min="20" max="300" step="10" value="100" oninput="sync()"></div>
<div class="field"><label>Shape θ <span class="val" id="v_th">1</span></label><input type="range" id="th" min="0.5" max="3" step="0.1" value="1" oninput="sync()"></div>
<div class="field"><label>Number of steps <span class="val" id="v_steps">40</span></label><input type="range" id="steps" min="10" max="200" step="5" value="40" oninput="sync()"></div>
<div class="btnrow">
  <button class="btn btn-primary" onclick="run()">▶ Run</button>
  <button class="btn btn-ghost" onclick="play()" id="playBtn">Play ▶</button>
  <button class="btn btn-ghost" onclick="step()">Step ⏭</button>
  <button class="btn btn-ghost" onclick="resetSim()">↺ Reset</button>
</div>
<div class="dl-label">Download</div>
<div class="btnrow">
  <button class="btn btn-accent" onclick="downloadPNG('logistic-growth.png')">⤓ PNG</button>
  <button class="btn btn-accent" onclick="downloadCSV()">⤓ CSV</button>
</div>
</div>
<div class="plotwrap">
<canvas class="field" id="field" width="720" height="240"></canvas>
<div class="counts" id="counts"></div>
<div class="plot-title" id="plotTitle">Logistic growth over time</div>
<canvas class="chart" id="chart" width="720" height="400"></canvas>
<div class="legend" id="legend"></div>
<div class="readout">Cursor: X = <b id="rx">–</b>, Y = <b id="ry">–</b></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="./js/main.js"></script>
<script src="../assets/js/iframeResize.js"></script>
        
        </body>
</html>
